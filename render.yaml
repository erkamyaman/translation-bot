services:
  - type: web
    name: translation-bot
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10 install --frozen-lockfile --prod=false && npx --yes pnpm@10 run build
    startCommand: node_modules/.bin/probot run ./dist/index.js
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: DAILY_CRON
        value: 'off'
      - key: APP_ID
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: DAILY_TOKEN
        sync: false
